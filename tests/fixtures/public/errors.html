<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ทดสอบ Console Error & Network Failures</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    h1 { color: #e11d48; }
    button { padding: 8px 16px; margin-right: 8px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; }
    .err-btn { background: #fee2e2; color: #991b1b; border-color: #fca5a5; font-weight: bold; }
  </style>
</head>
<body>
  <a href="/">← กลับหน้าหลัก</a>
  <h1>จำลองข้อผิดพลาด (Console & Network)</h1>
  <p>หน้านี้จะทำการ emit console logs และ request ล้มเหลวอัตโนมัติ เพื่อทดสอบ Web Inspector ใน Browser Nova</p>

  <div>
    <button class="err-btn" onclick="triggerConsoleError()">สร้าง Console Error ใหม่</button>
    <button class="err-btn" onclick="triggerFailedNetwork()">สร้าง Failed 404 Request</button>
  </div>

  <script>
    console.log('[Fixture] หน้าเว็บโหลดเรียบร้อย');
    console.warn('[Fixture Warning] ตัวอย่าง warning สำหรับทดสอบ Inspector');
    console.error('[Fixture Error] ตัวอย่าง critical error สำหรับทดสอบ Inspector');

    // Automatically trigger a 404 network request
    setTimeout(() => {
      fetch('/api/non-existent-endpoint-404').catch(e => console.error('Fetch failed:', e));
    }, 500);

    function triggerConsoleError() {
      console.error('[Manual Error] เกิดข้อผิดพลาดแบบจำลองเวลา ' + new Date().toLocaleTimeString());
    }

    function triggerFailedNetwork() {
      fetch('/api/broken-service-' + Date.now()).catch(e => console.error('Fetch error:', e));
    }
  </script>
</body>
</html>
